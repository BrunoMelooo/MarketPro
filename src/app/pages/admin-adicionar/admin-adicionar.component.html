<div class="container-admin-sub">
  <header class="cabecalho-sub">
    <div class="brand">
      <h2>MarketPro <span>Cadastro de Produtos</span></h2>
      <p class="user">Administrador: <strong>{{ servicoAutenticacao.valorUsuarioAtual?.nome || 'Bruno Melo' }}</strong></p>
    </div>
    <div class="header-acoes">
      <button type="button" (click)="irParaEstoque()" class="btn-secundario">Gerenciar Estoque</button>
      <button type="button" (click)="voltarPainel()" class="btn-voltar">← Voltar ao Painel</button>
    </div>
  </header>

  <div *ngIf="mensagemFeedback" class="toast-admin">
    {{ mensagemFeedback }}
  </div>

  <section class="card card-formulario-central">
    <h3>Adicionar Novo Produto ao Catálogo</h3>
    <p class="subtitulo-form">Preencha os dados abaixo para disponibilizar o item na loja virtual e no inventário.</p>

    <form (ngSubmit)="adicionarProduto()">
      <div class="grupo-formulario">
        <label>Nome do Produto *</label>
        <input
          type="text"
          [(ngModel)]="novoProduto.nome"
          name="nome"
          required
          class="controle-formulario"
          placeholder="Ex: Arroz Integral 5kg"
        />
      </div>

      <div class="linha-dupla">
        <div class="grupo-formulario">
          <label>Categoria</label>
          <input
            type="text"
            [(ngModel)]="novoProduto.categoria"
            name="categoria"
            class="controle-formulario"
            placeholder="Ex: Alimentos, Limpeza, Mercearia"
          />
        </div>

        <div class="grupo-formulario">
          <label>Preço Unitário (R$) *</label>
          <input
            type="number"
            step="0.01"
            min="0.01"
            [(ngModel)]="novoProduto.preco"
            name="preco"
            required
            class="controle-formulario"
            placeholder="0.00"
          />
        </div>
      </div>

      <div class="linha-dupla">
        <div class="grupo-formulario">
          <label>Quantidade Inicial em Estoque *</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="novoProduto.estoque"
            name="estoque"
            required
            class="controle-formulario"
            placeholder="0"
          />
        </div>

        <div class="grupo-formulario">
          <label>URL ou Caminho da Imagem (opcional)</label>
          <input
            type="text"
            [(ngModel)]="novoProduto.imagemUrl"
            name="imagemUrl"
            class="controle-formulario"
            placeholder="Ex: assets/imagens/produto.jpg ou https://..."
          />
        </div>
      </div>

      <div class="acoes-form">
        <button type="button" (click)="voltarPainel()" class="btn-cancelar">Cancelar</button>
        <button type="submit" [disabled]="salvando" class="btn-enviar">
          {{ salvando ? 'Salvando...' : 'Salvar Produto no Inventário' }}
        </button>
      </div>
    </form>
  </section>
</div>
