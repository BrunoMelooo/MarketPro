<div class="container-form">
  <div class="card-form">
    <header class="header-form">
      <h2>{{ modoEdicao ? 'Editar Produto' : 'Cadastrar Novo Produto' }}</h2>
      <p class="subtitulo">Preencha os campos abaixo para atualizar o inventário do MarketPro</p>
    </header>

    <form (ngSubmit)="salvar()">
      <div class="grupo">
        <label>Nome do Produto*</label>
        <input type="text" [(ngModel)]="produto.nome" name="nome" required class="input-text" placeholder="Ex: Macarrão Spagheti 500g">
      </div>

      <div class="grid-2">
        <div class="grupo">
          <label>Categoria*</label>
          <input type="text" [(ngModel)]="produto.categoria" name="categoria" required class="input-text" placeholder="Ex: Mercearia">
        </div>
        <div class="grupo">
          <label>Preço Unitário (R$)*</label>
          <input type="number" step="0.01" [(ngModel)]="produto.preco" name="preco" required class="input-text" placeholder="0.00">
        </div>
      </div>

      <div class="grupo">
        <label>Quantidade em Estoque (Unidades)*</label>
        <input type="number" [(ngModel)]="produto.estoque" name="estoque" required class="input-text" placeholder="0">
      </div>

      <div class="presets-wrapper">
        <label class="label-presets">Selecione a imagem ilustrativa da categoria:</label>
        <div class="grid-presets">
          <button type="button" *ngFor="let preset of presetImagens" (click)="selecionarPreset(preset.url)" 
                  class="btn-preset" [class.ativo]="produto.imagemUrl === preset.url">
            {{ preset.label }}
          </button>
        </div>
      </div>

      <div *ngIf="produto.imagemUrl" class="preview-wrapper">
        <label>Imagem Selecionada:</label>
        <div class="box-preview">
          <img [src]="produto.imagemUrl" alt="Preview Produto">
        </div>
      </div>

      <div class="acoes-form">
        <button type="button" (click)="cancelar()" class="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-salvar">{{ modoEdicao ? 'Salvar Alterações' : 'Cadastrar Produto' }}</button>
      </div>
    </form>
  </div>
</div>
