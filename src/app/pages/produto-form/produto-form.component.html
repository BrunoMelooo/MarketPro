<div class="container">
  <h2>{{ isEdicao ? 'Edição de Produto' : 'Cadastro de Produto' }}</h2>

  <form (ngSubmit)="salvar()" class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label>Nome do Produto *</label>
        <input type="text" [(ngModel)]="produto.nome" name="nome" required class="form-control">
      </div>

      <div class="form-group">
        <label>Código de Barras *</label>
        <input type="text" [(ngModel)]="produto.codigo" name="codigo" required class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Categoria *</label>
        <select [(ngModel)]="produto.categoria" name="categoria" class="form-control">
          <option value="Laticínios">Laticínios</option>
          <option value="Mercearia">Mercearia</option>
          <option value="Limpeza">Limpeza</option>
          <option value="Biscoitos">Biscoitos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fornecedor</label>
        <input type="text" [(ngModel)]="produto.fornecedor" name="fornecedor" class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Preço de Custo (R$) *</label>
        <input type="number" step="0.01" [(ngModel)]="produto.precoCusto" name="precoCusto" required class="form-control">
      </div>

      <div class="form-group">
        <label>Preço de Venda (R$) *</label>
        <input type="number" step="0.01" [(ngModel)]="produto.precoVenda" name="precoVenda" required class="form-control">
      </div>

      <div class="form-group">
        <label>Estoque Atual *</label>
        <input type="number" [(ngModel)]="produto.estoqueAtual" name="estoqueAtual" required class="form-control">
      </div>

      <div class="form-group">
        <label>Estoque Mínimo *</label>
        <input type="number" [(ngModel)]="produto.estoqueMinimo" name="estoqueMinimo" required class="form-control">
      </div>
    </div>

    <div class="form-actions">
      <button type="button" (click)="cancelar()" class="btn btn-secondary">CANCELAR</button>
      <button type="submit" class="btn btn-primary">SALVAR PRODUTO</button>
    </div>
  </form>
</div>
