<div class="login-container">
  <div class="login-card">
    <div class="header-card">
      <h2>MarketPro</h2>
      <span class="badge" [class.badge-admin]="perfilAlvo === 'admin'">
        {{ perfilAlvo === 'admin' ? 'Acesso Corporativo' : 'Minha Conta' }}
      </span>
    </div>
    <p class="subtitle">
      {{ perfilAlvo === 'admin' ? 'Autenticação restrita para colaboradores autorizados' : 'Entre para acompanhar seus pedidos e agilizar suas compras' }}
    </p>

    <div *ngIf="mensagemErro" class="alerta-erro">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="entrar()">
      <div class="grupo-campo">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" required class="campo-texto" placeholder="seu@email.com">
      </div>
      <div class="grupo-campo">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" required class="campo-texto" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-entrar" [class.btn-admin]="perfilAlvo === 'admin'">
        {{ perfilAlvo === 'admin' ? 'Entrar no Painel de Gestão' : 'Entrar na Loja' }}
      </button>
    </form>

    <button (click)="voltar()" class="btn-voltar">← Voltar para a loja</button>
  </div>
</div>
