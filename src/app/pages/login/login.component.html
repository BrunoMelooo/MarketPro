<div class="login-wrapper">
  <div class="login-card">
    <h2>MarketPro</h2>
    <p class="subtitle">Acesso ao Sistema</p>

    <div *ngIf="mensagemErro" class="error-box">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="fazerLogin()">
      <div class="form-group">
        <label>Usuário / E-mail</label>
        <input type="email" [(ngModel)]="usuario" name="usuario" required class="form-control">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" required class="form-control">
      </div>

      <button type="submit" class="btn btn-primary btn-block">ENTRAR NO SISTEMA</button>
    </form>
  </div>
</div>
