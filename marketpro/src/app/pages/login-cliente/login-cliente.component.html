<div class="login-wrapper">
  <div class="login-card">
    <div class="badge-loja">🛒 ÁREA DE COMPRAS DO CLIENTE</div>
    <h2>MarketPro Online</h2>
    <p class="subtitle">Faça seu login de comprador para abastecer sua despensa</p>

    <div *ngIf="erro" class="error-box">{{ erro }}</div>

    <form (ngSubmit)="entrarComoCliente()">
      <div class="form-group">
        <label>Seu Nome Completo</label>
        <input type="text" [(ngModel)]="nomeCliente" name="nomeCliente" required class="form-control" placeholder="Ex: Maria Silva">
      </div>

      <div class="form-group">
        <label>E-mail do Comprador</label>
        <input type="email" [(ngModel)]="email" name="email" required class="form-control">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" required class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-success btn-block">ENTRAR E FAZER COMPRAS 🛍️</button>
    </form>
  </div>
</div>
